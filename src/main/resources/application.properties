spring.application.name=riceshop
# Provide JWT_SECRET as Base64-encoded random data of at least 32 bytes.
app.jwt.secret=xaLKj7FWUfMxqntaLB4DauLYSsXq026hG9Vl4AeqjNI=

spring.datasource.url=jdbc:postgresql://localhost:5432/grt-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Let Flyway manage the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG